syntax = "proto3";
package relay;

service ClientRelay {
  rpc Subscribe(SubscribeRequest) returns (stream ServerEvent);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc StreamFile(StreamFileRequest) returns (stream FileChunk);
}

message SubscribeRequest {
  string auth_token = 1;
  string pairing_id = 2;
  uint32 client_capabilities = 3;
}

message ServerEvent {
  oneof event {
    SessionToken session_token = 1;
    MobileConnected mobile_connected = 2;
    MobileDisconnected mobile_disconnected = 3;
    ClipboardText clipboard_text = 4;
    Ping ping = 5;
    FileReceived file_received = 7;
  }
  // 服务端在首帧 SessionToken 事件中附带的 gRPC 会话令牌，用于后续 Ping 鉴权。
  string grpc_session_token = 6;
}

message SessionToken {
  string token = 1;
  string url = 2;
}

message MobileConnected {
  string device_info = 1;
}

message MobileDisconnected {}

message ClipboardText {
  string content = 1;
}

message Ping {}

/// 文件传输模式。RELAY 表示通过服务端中继下载，P2P 为未来 P2P 直连预留，STREAMING 为 gRPC 流式直传，HTTP_STREAMING 为 HTTP chunked 流式直传。
enum TransferMode {
  RELAY = 0;
  P2P = 1;
  STREAMING = 2;
  HTTP_STREAMING = 3;
}

/// 服务端通过 gRPC 流向 PC 客户端推送文件接收通知。
///
/// `file_access_token` 为 32 字节安全随机令牌（bytes 类型），客户端构造
/// HTTP 请求时须将其转换为 lowercase hex 字符串（64 字符），放入
/// `Authorization: Bearer` 头；不得编码进 URL。
message FileReceived {
  string file_id = 1;
  string file_name = 2;
  string mime_type = 3;
  uint64 size_bytes = 4;
  string download_url = 5;
  string sha256 = 6;
  TransferMode transfer_mode = 7;
  // 文件级访问令牌，32 字节原始数据，通过 gRPC TLS 通道下发。
  // 客户端 HTTP 请求时转为 lowercase hex 字符串填入 Authorization: Bearer 头。
  bytes file_access_token = 8;
}

message PingRequest {
  string grpc_session_token = 1;
}

message PingResponse {}

/// PC 客户端向服务端请求 gRPC 流式文件接收。
message StreamFileRequest {
  string file_id = 1;
  bytes file_access_token = 2;
}

/// 服务端向 PC 客户端流式推送的文件数据帧。
///
/// `is_last=false` 时 `data` 为文件内容；`is_last=true` 时 `data` 为空，
/// `sha256` 为完整文件的 SHA-256（32 字节原始数据）。
message FileChunk {
  uint32 sequence_number = 1;
  bytes data = 2;
  bool is_last = 3;
  bytes sha256 = 4;
}
