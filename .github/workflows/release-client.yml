# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release Client

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release, for example client-v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-client:
    name: Build Client (Windows x86_64)
    runs-on: windows-latest
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@v6

      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-windows

      - name: Build client
        run: cargo build --release --locked -p client

      - name: Package client archive
        id: package
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ inputs.tag }}"
          } else {
            $rawTag = $env:GITHUB_REF_NAME
          }
          $version = $rawTag -replace '^client-', ''
          $archive = "qr-paste-client-windows-x86_64-${version}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/qr-paste-client.exe dist/
          Copy-Item client.example.toml dist/
          Copy-Item LICENSE-MIT dist/
          Copy-Item LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath $archive
          echo "archive=$archive" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: client-artifact
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-artifact"
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: "*.zip"
          generate_release_notes: true
