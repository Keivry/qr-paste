<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <title>发送文字到 PC</title>
    <style nonce="__NONCE__">
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) 0
        env(safe-area-inset-left, 0);
    }
    @supports (height: 100dvh) {
      body {
        height: 100dvh;
      }
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 16px;
    }
    #status {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 16px;
      text-align: center;
    }
    .status-connecting {
      background: #fff3cd;
      color: #856404;
    }
    .status-connected {
      background: #d1e7dd;
      color: #0a3622;
    }
    .status-error {
      background: #f8d7da;
      color: #58151c;
    }
    .input-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    textarea {
      height: 120px;
      width: 100%;
      min-height: 0;
      padding: 12px;
      font-size: 16px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      resize: none;
      outline: none;
      background: #fff;
    }
    textarea:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
      outline: none;
    }
    .action-area {
      flex-shrink: 0;
      background: #f5f5f5;
      padding: 12px 0 max(env(safe-area-inset-bottom, 0px), 8px);
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 8px;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px 0;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: #0d6efd;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
    }
    button:disabled {
      background: #adb5bd;
      cursor: not-allowed;
    }
    #add-file-btn {
      width: 44px;
      min-height: 44px;
      border: 1.5px solid #0d6efd;
      background: transparent;
      color: #0d6efd;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    #add-file-btn:disabled {
      border-color: #adb5bd;
      color: #adb5bd;
      cursor: not-allowed;
    }
    #send-btn {
      flex: 1;
    }
    #file-list {
      overflow-y: auto;
      max-height: 180px;
    }
    .file-item {
      background: #fff;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      position: relative;
      overflow: hidden;
    }
    .file-item-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .file-item-name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item-size {
      font-size: 12px;
      color: #6c757d;
      white-space: nowrap;
    }
    .file-item-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #6c757d;
      font-size: 16px;
      padding: 0 2px;
      width: auto;
      min-height: auto;
      display: inline;
      line-height: 1;
    }
    .file-item-status {
      font-size: 12px;
      margin-top: 4px;
    }
    .file-item-status-ok {
      color: #198754;
    }
    .file-item-status-err {
      color: #dc3545;
    }
    .file-progress-bar-wrap {
      height: 3px;
      background: #e9ecef;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .file-progress-bar {
      height: 3px;
      border-radius: 2px;
      transition: width 0.2s;
      width: 0%;
      background: #0d6efd;
    }
    #file-input {
      display: none;
    }
    @media (orientation: landscape) {
      textarea {
        height: 60px;
        min-height: 0;
      }
    }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="status" class="status-connecting">连接中...</div>
      <div class="input-area">
        <textarea id="input" placeholder="输入要发送到 PC 的文本..." disabled></textarea>
      </div>
      <div id="file-list" style="display:none; margin-bottom: 10px;"></div>
      <div class="action-area">
        <button id="add-file-btn" type="button" disabled>+</button>
        <input id="file-input" type="file" multiple>
        <button id="send-btn" type="button" disabled>发送</button>
      </div>
    </div>

    <script nonce="__NONCE__">
    const pairingId = "__PAIRING_ID__"
    const statusEl = document.getElementById("status")
    const inputEl = document.getElementById("input")
    const sendBtn = document.getElementById("send-btn")
    const addFileBtn = document.getElementById("add-file-btn")
    const fileInput = document.getElementById("file-input")
    const fileListEl = document.getElementById("file-list")
    const wsProto = location.protocol === "https:" ? "wss" : "ws"

    const initialHash = window.location.hash
    const pairingSecret = (() => {
      const fragment = initialHash.startsWith("#ps=")
        ? decodeURIComponent(initialHash.slice(4))
        : ""
      history.replaceState(null, "", `/m/${pairingId}`)
      return fragment
    })()

    let ws = null
    let heartbeatTimer = null

    let reconnectState = "idle"
    let retryCount = 0
    let totalElapsedMs = 0
    let reconnectDelay = 1000
    let actionMode = "send"
    let uploadInProgress = false

    let selectedFiles = []
    let nextFileId = 1

    function setStatus(text, cls) {
      statusEl.textContent = text
      statusEl.className = `status-${cls}`
    }

    function updateSendButton() {
      if (actionMode === "reconnect") {
        sendBtn.textContent = "重新连接"
        sendBtn.disabled = reconnectState !== "stopped"
        return
      }
      sendBtn.textContent = "发送"
      const hasText = inputEl.value.trim() !== ""
      const hasFiles = selectedFiles.length > 0
      sendBtn.disabled = inputEl.disabled || (!hasText && !hasFiles) || uploadInProgress
    }

    function updateUploadButton(connected) {
      addFileBtn.disabled = !connected || uploadInProgress
    }

    function renderFileList() {
      fileListEl.innerHTML = ""
      if (selectedFiles.length === 0) {
        fileListEl.style.display = "none"
        updateSendButton()
        return
      }
      fileListEl.style.display = "block"

      for (const entry of selectedFiles) {
        const itemEl = document.createElement("div")
        itemEl.className = "file-item"

        const headerEl = document.createElement("div")
        headerEl.className = "file-item-header"

        const nameEl = document.createElement("div")
        nameEl.className = "file-item-name"
        nameEl.textContent = entry.file.name

        const sizeEl = document.createElement("div")
        sizeEl.className = "file-item-size"
        const sizeKb = (entry.file.size / 1024).toFixed(1)
        sizeEl.textContent = sizeKb > 1024 ? (sizeKb / 1024).toFixed(1) + " MB" : sizeKb + " KB"

        const removeBtn = document.createElement("button")
        removeBtn.className = "file-item-remove"
        removeBtn.textContent = "×"
        removeBtn.disabled = uploadInProgress
        removeBtn.onclick = () => {
          if (uploadInProgress) return
          selectedFiles = selectedFiles.filter((f) => f.id !== entry.id)
          renderFileList()
        }

        headerEl.appendChild(nameEl)
        headerEl.appendChild(sizeEl)
        headerEl.appendChild(removeBtn)
        itemEl.appendChild(headerEl)

        const statusEl = document.createElement("div")
        statusEl.className = "file-item-status"
        statusEl.textContent = "等待发送"
        itemEl.appendChild(statusEl)

        const progressWrap = document.createElement("div")
        progressWrap.className = "file-progress-bar-wrap"
        const progressBar = document.createElement("div")
        progressBar.className = "file-progress-bar"
        progressWrap.appendChild(progressBar)
        itemEl.appendChild(progressWrap)

        entry.el = itemEl
        entry.statusEl = statusEl
        entry.progressBar = progressBar

        fileListEl.appendChild(itemEl)
      }
      updateSendButton()
    }

    function enableInput(enabled) {
      inputEl.disabled = !enabled
      updateSendButton()
      updateUploadButton(enabled)
    }

    function setActionMode(mode) {
      actionMode = mode
      updateSendButton()
    }

    function clearHeartbeat() {
      if (heartbeatTimer !== null) {
        clearInterval(heartbeatTimer)
        heartbeatTimer = null
      }
    }

    async function api(path, body) {
      const response = await fetch(path, {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : "{}",
      })
      let data = {}
      try {
        data = await response.json()
      } catch (_error) {}
      return { response, data }
    }

    function uploadSingleFile(entry) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest()
        xhr.open("POST", `/api/pairing/${pairingId}/upload`, true)
        xhr.withCredentials = true

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100)
            entry.progressBar.style.width = percent + "%"
            entry.statusEl.textContent = `上传中 ${percent}%`
          }
        }

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            entry.progressBar.style.width = "100%"
            entry.progressBar.style.background = "#198754"
            entry.statusEl.textContent = "✓ 已发送"
            entry.statusEl.className = "file-item-status file-item-status-ok"
            resolve(true)
          } else {
            let msg = `上传失败（${xhr.status}）`
            try {
              const data = JSON.parse(xhr.responseText)
              if (data.error) msg = data.error
            } catch (_e) {}
            entry.progressBar.style.background = "#dc3545"
            entry.statusEl.textContent = `✗ ${msg}`
            entry.statusEl.className = "file-item-status file-item-status-err"
            resolve(false)
          }
        }

        xhr.onerror = () => {
          entry.progressBar.style.background = "#dc3545"
          entry.statusEl.textContent = "✗ 网络错误"
          entry.statusEl.className = "file-item-status file-item-status-err"
          resolve(false)
        }

        const formData = new FormData()
        formData.append("file", entry.file, entry.file.name)
        xhr.send(formData)
      })
    }

    function clearStoredPairingId() {
      if (localStorage.getItem("qr_paste_pairing_id") === pairingId) {
        localStorage.removeItem("qr_paste_pairing_id")
      }
    }

    function stopWithError(message, options = {}) {
      const { clearStoredPairing = false, allowReconnect = false } = options
      if (clearStoredPairing) {
        clearStoredPairingId()
      }
      reconnectState = "stopped"
      clearHeartbeat()
      ws = null
      enableInput(false)
      setActionMode(allowReconnect ? "reconnect" : "send")
      setStatus(message, "error")
    }

    function resetReconnectBudget() {
      retryCount = 0
      totalElapsedMs = 0
      reconnectDelay = 1000
    }

    function startReconnect() {
      if (reconnectState !== "idle" && reconnectState !== "connected") {
        return
      }
      if (!localStorage.getItem("qr_paste_pairing_id")) {
        stopWithError("无配对信息，请重新扫码", { clearStoredPairing: true })
        return
      }
      if (retryCount >= 10 || totalElapsedMs >= 600000) {
        stopWithError("重连次数已耗尽，请重新扫码")
        return
      }
      reconnectState = "checking_status"
      doCheckStatus()
    }

    async function doCheckStatus() {
      try {
        const { response, data } = await api(`/api/pairing/${pairingId}/status`)
        if (response.status === 401) {
          stopWithError("登录已过期，请重新扫码", { clearStoredPairing: true })
          return
        }
        if (response.status === 404) {
          stopWithError("配对记录不存在，请重新扫码", { clearStoredPairing: true })
          return
        }
        if (response.ok && data.online) {
          reconnectState = "requesting_ticket"
          doRequestTicket()
          return
        }
        setStatus("等待 PC 在线...", "connecting")
        scheduleBackoff(() => {
          reconnectState = "checking_status"
          doCheckStatus()
        })
      } catch (_error) {
        scheduleBackoff(() => {
          reconnectState = "checking_status"
          doCheckStatus()
        })
      }
    }

    async function doRequestTicket() {
      try {
        const { response, data } = await api(`/api/pairing/${pairingId}/ws-ticket`)
        if (response.status === 401) {
          stopWithError("凭据失效，请重新扫码", { clearStoredPairing: true })
          return
        }
        if (response.status === 404) {
          stopWithError("配对记录不存在，请重新扫码", { clearStoredPairing: true })
          return
        }
        if (response.ok && data.ws_ticket) {
          reconnectState = "connecting_ws"
          doConnectWs(data.ws_ticket)
          return
        }
        reconnectState = "backoff"
        scheduleBackoff(() => {
          reconnectState = "checking_status"
          doCheckStatus()
        })
      } catch (_error) {
        reconnectState = "backoff"
        scheduleBackoff(() => {
          reconnectState = "checking_status"
          doCheckStatus()
        })
      }
    }

    function doConnectWs(ticket) {
      ws = new WebSocket(`${wsProto}://${location.host}/ws/mobile/${pairingId}`, [
        "qr-paste.v1",
        `ticket.${ticket}`,
      ])
      ws.addEventListener("open", () => {
        reconnectState = "connected"
        resetReconnectBudget()
        setActionMode("send")
        setStatus("已连接到 PC", "connected")
        enableInput(true)
        heartbeatTimer = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "ping" }))
          }
        }, 30000)
      })
      ws.addEventListener("message", (event) => {
        try {
          const message = JSON.parse(event.data)
          if (message.type === "client_disconnected") {
            setStatus("PC 客户端已断开", "error")
            enableInput(false)
          } else if (message.type === "pong") {
            console.log("[qr-paste] pong received")
          }
        } catch (_error) {}
      })
      ws.addEventListener("close", (event) => {
        clearHeartbeat()
        ws = null
        if (event.code === 4001) {
          stopWithError("已在其他设备上打开，可点下方按钮重新连接", { allowReconnect: true })
        } else if (event.code === 4002) {
          stopWithError("凭据已更新，请重新扫码", { clearStoredPairing: true })
        } else {
          reconnectState = "idle"
          setActionMode("send")
          enableInput(false)
          startReconnect()
        }
      })
      ws.addEventListener("error", (event) => {
        console.error("[qr-paste] websocket error", event)
      })
    }

    function scheduleBackoff(callback) {
      const baseDelay = reconnectDelay
      const jitteredDelay = Math.round(baseDelay * (0.8 + Math.random() * 0.4))
      reconnectDelay = Math.min(baseDelay * 2, 60000)

      function startTimer() {
        retryCount++
        totalElapsedMs += baseDelay
        if (retryCount >= 10 || totalElapsedMs >= 600000) {
          stopWithError("重连次数已耗尽，请重新扫码")
          return
        }
        setStatus("重连中...", "connecting")
        setTimeout(callback, jitteredDelay)
      }

      if (document.hidden) {
        const onVisible = () => {
          if (!document.hidden) {
            document.removeEventListener("visibilitychange", onVisible)
            startTimer()
          }
        }
        document.addEventListener("visibilitychange", onVisible)
      } else {
        startTimer()
      }
    }

    async function bootstrap() {
      if (!pairingSecret && localStorage.getItem("qr_paste_pairing_id") === pairingId) {
        reconnectState = "idle"
        startReconnect()
        return
      }
      if (!pairingSecret) {
        setStatus("缺少配对凭据，请重新扫码", "error")
        return
      }
      const { response, data } = await api(`/api/pairing/${pairingId}/bootstrap`, {
        pairing_secret: pairingSecret,
      })
      if (!response.ok) {
        setStatus(response.status === 404 ? "二维码已失效，请重新扫码" : "初始化失败", "error")
        return
      }
      localStorage.setItem("qr_paste_pairing_id", pairingId)
      reconnectState = "idle"
      if (data.online) {
        reconnectState = "requesting_ticket"
        doRequestTicket()
      } else {
        reconnectState = "checking_status"
        doCheckStatus()
      }
    }

    inputEl.addEventListener("input", updateSendButton)
    sendBtn.addEventListener("click", () => {
      if (actionMode === "reconnect") {
        resetReconnectBudget()
        reconnectState = "idle"
        setActionMode("send")
        startReconnect()
        return
      }

      const content = inputEl.value.trim()
      const hasText = content !== ""
      const hasFiles = selectedFiles.length > 0

      if (!hasText && !hasFiles) return
      if (!ws || ws.readyState !== WebSocket.OPEN) return

      if (hasText) {
        ws.send(JSON.stringify({ type: "clipboard_text", content }))
        inputEl.value = ""
      }

      if (hasFiles) {
        uploadInProgress = true
        updateSendButton()
        updateUploadButton(reconnectState === "connected")

        const removeBtns = document.querySelectorAll(".file-item-remove")
        for (const btn of removeBtns) btn.disabled = true

        Promise.all(selectedFiles.map((entry) => uploadSingleFile(entry))).then(() => {
          uploadInProgress = false
          selectedFiles = []
          renderFileList()
          updateUploadButton(reconnectState === "connected")
          updateSendButton()
        })
      } else {
        updateSendButton()
      }
    })

    addFileBtn.addEventListener("click", () => {
      if (!uploadInProgress) fileInput.click()
    })

    fileInput.addEventListener("change", () => {
      if (!fileInput.files || fileInput.files.length === 0) return
      for (const file of fileInput.files) {
        selectedFiles.push({ file, id: nextFileId++ })
      }
      renderFileList()
      fileInput.value = ""
    })

    bootstrap()
    </script>
  </body>
</html>
