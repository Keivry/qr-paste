# 必填：服务端对外可访问的基础 URL（不带尾部斜线）
public_base_url = "https://example.com"

# 必填：gRPC 鉴权令牌，客户端必须提供完全一致的值
# 注意：该令牌会明文保存在本地配置文件中，请勿提交到仓库
grpc_auth_token = "change-this-long-random-token"

# gRPC 端口（Windows 客户端连接）
grpc_port = 50051

# HTTP 端口（手机浏览器访问）
http_port = 8080

# HTTP/WebSocket 监听地址，默认 127.0.0.1；若需直接监听所有网卡可改为 0.0.0.0
http_bind_host = "127.0.0.1"

# gRPC 监听地址，默认 127.0.0.1；强烈建议只在反向代理或受信网络后暴露
grpc_bind_host = "127.0.0.1"

# 令牌有效期（秒），默认 300（5 分钟）
token_expiry_secs = 300

# pairing 记录保留时长（秒），默认 86400（24 小时）
pairing_ttl_secs = 86400

# 令牌清理间隔（秒），默认 60
token_cleanup_interval_secs = 60

# 每 IP 每分钟 WebSocket 连接次数限制，默认 10
ws_rate_limit_per_ip_per_min = 10

# 每 IP 每分钟 HTTP 请求次数限制，默认 20
http_rate_limit_per_ip_per_min = 20

# 全局最大 WebSocket 并发连接数，默认 100
max_ws_connections = 100

# 单条 WebSocket 消息最大字节数，默认 65536（64KB）
max_message_size_bytes = 65536

# WebSocket 空闲超时（秒），默认 90
ws_idle_timeout_secs = 90

# gRPC keepalive 心跳间隔（秒），默认 60
grpc_keepalive_interval_secs = 60

# gRPC keepalive 超时（秒），默认 20
grpc_keepalive_timeout_secs = 20

# 日志级别：trace / debug / info / warn / error，默认 info
log_level = "info"

# 可信反向代理 CIDR 白名单；默认空列表，表示始终使用 TCP peer IP
# 只有当连接来源 IP 命中这些 CIDR 时，服务端才会信任代理覆写的头部：
# 1) 优先取 X-Forwarded-For 最右侧 IP；2) 若 XFF 缺失，则取 X-Real-IP；
# 3) 若头部缺失或格式非法，则回退到 TCP peer IP
# 仅在你明确知道反向代理出口 IP / 网段时填写，例如：["127.0.0.1/32"]
trusted_proxy_cidrs = []

# SQLite 持久化数据库路径；设为空字符串 "" 可禁用持久化（默认 "qr-paste-state.db"）
# 路径相对于服务进程的工作目录，也可填写绝对路径
# 启用后，server 重启时会自动恢复配对记录和浏览器会话，并定期清除过期数据
persistence_path = "qr-paste-state.db"

# ──────────────────────────────────────────────────────────────────────────────
# 文件上传配置
# ──────────────────────────────────────────────────────────────────────────────

# 必填：文件上传临时目录（绝对路径推荐）。服务端启动时若目录不存在会自动创建；
# 若为文件/符号链接或无写权限，启动时 fatal 退出。
# 建议独立挂载或配置磁盘配额限制，避免上传文件耗尽系统磁盘。
upload_dir = "/var/lib/qr-paste/uploads"

# 单文件上传大小上限（字节），默认 52428800（50 MB）。超出返回 HTTP 413。
max_upload_size_bytes = 52428800

# 上传文件最大保留时间（秒），默认 3600（1 小时）。
# 超时后后台清理任务会删除文件。建议大于 "最差网速下完整下载一次 + 客户端最大重试次数 × 重试延迟"。
# 调低到 60 秒以下须评估网络条件与重试策略。
upload_file_retention_secs = 3600

# 后台清理任务执行间隔（秒），默认 300（5 分钟）
upload_cleanup_interval_secs = 300

# 每 IP 每分钟允许的最大上传请求次数，默认 6。超出返回 HTTP 429。
# 注意：per_ip 语义仅在 trusted_proxy_cidrs 正确配置时成立。
upload_rate_limit_per_ip_per_min = 6

# 上传 body 接收超时（秒），默认 30。服务端自身强制，不依赖反向代理配置。超时返回 HTTP 408。
upload_body_timeout_secs = 30

# 单 pairing 内最大 pending 文件数（含 Uploading 状态），默认 20。超出返回 HTTP 429。
max_pending_upload_files_per_pairing = 20

# 全局所有 pairing 内最大 pending 文件总数，默认 500。超出返回 HTTP 429。
max_pending_upload_files_global = 500

# 全局 pending 文件总字节数硬上限（字节），默认 2147483648（2 GB）。超出返回 HTTP 429。
# 注意：此为协议层硬上限，不依赖磁盘配额；建议同时配置磁盘配额作为部署层防护。
max_pending_upload_bytes_global = 2147483648

# ──────────────────────────────────────────────────────────────────────────────
# 调试选项（仅限开发 / 局域网测试）
# ──────────────────────────────────────────────────────────────────────────────

# 调试模式，默认 false。开启后放宽 public_base_url 限制：允许 http:// 及内网 IP，
# 便于在局域网中测试而无需 TLS 证书。
# ⚠️ 生产环境必须保持 false：http:// 下会话 Cookie 降级为无 Secure 属性的 legacy 模式，
# 且 gRPC 认证令牌以明文传输。
# debug_mode = false
